name: Build & Test
on: [push, pull_request]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: make test

  tasm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run TASM compiler tests
        run: python3 tests/host/test_tasm.py
      - name: Run LoomScript compiler tests
        run: python3 tests/host/test_loomc.py

  # Gates the lines a change touches, not the whole tree. `make format-check`
  # reports tree-wide and currently fails by design: the repository predates
  # any enforced style and reformatting it wholesale would bury history in
  # `git blame`. Gating the diff converges the tree without that cost.
  #
  # This job previously ran `make format-check`, which could not fail — it
  # piped clang-format into `head`, discarding the exit status, then printed
  # "Format check passed." unconditionally. It was green for its whole life,
  # including on commits that violated the style it claimed to enforce.
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # git-clang-format needs the base commit present
      - name: Install clang-format
        # The pip package ships git-clang-format; the apt one does not.
        # --user, not --prefix: pip appends its own "local" segment to a prefix,
        # so --prefix=/usr/local resolves to /usr/local/local and fails as
        # non-root. The --break-system-packages fallback covers a PEP 668
        # externally-managed interpreter.
        run: |
          python3 -m pip install --user clang-format \
            || python3 -m pip install --user --break-system-packages clang-format
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check formatting of changed lines
        run: |
          command -v clang-format
          command -v git-clang-format
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # A branch's first push reports an all-zero before-sha, and a
          # force-push can name a commit that is no longer reachable.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          echo "Comparing against $BASE"
          make format-diff BASE="$BASE"

  # Compiles the ESP-independent firmware for real, with -Wall -Wextra -Werror.
  # Seconds rather than the three minutes an ESP-IDF build takes, and stricter
  # than ESP-IDF's own flags, so it fails first and says more.
  warn-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with warnings as errors
        run: make warn-check

  # The SVD-generated SoC header must not drift from the SVD or the mapping.
  soc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated SoC header is current
        run: make soc-check

  # No telemetry emission while the loom lock is held.
  lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check loom lock discipline
        run: make lock-check

  # The independence ratchet. No tier of ESP-IDF dependency may grow, and a
  # dependency the classifier does not recognise is an error rather than a
  # warning — that is what stops a new kind of coupling arriving as noise.
  independence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ESP-IDF independence ratchet
        run: make independence-check

  doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        run: python3 tools/check_doc_links.py

  build-esp32c6:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-C6 (ESP-NOW mode)
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32c6
          idf.py build
      - name: Prove SoC constants match ESP-IDF
        # Runs natively here: the job is already inside the ESP-IDF image, and
        # compile_commands.json from the build above supplies the exact flags.
        run: |
          . $IDF_PATH/export.sh
          tools/check_soc_bridge.sh

  build-esp32c6-802154:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-C6 (802.15.4 mode)
        run: |
          . $IDF_PATH/export.sh
          sed -i 's/CONFIG_REFLEX_RADIO_ESPNOW=y/# CONFIG_REFLEX_RADIO_ESPNOW is not set/' sdkconfig.defaults 2>/dev/null || true
          echo "CONFIG_REFLEX_RADIO_802154=y" >> sdkconfig.defaults
          idf.py set-target esp32c6
          idf.py build

  build-esp32c6-kernel:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-C6 (kernel scheduler mode)
        run: |
          . $IDF_PATH/export.sh
          echo "CONFIG_REFLEX_KERNEL_SCHEDULER=y" >> sdkconfig.defaults
          idf.py set-target esp32c6
          idf.py build

  # The FreeRTOS-free task backend. Off by default and not yet runnable — see
  # its Kconfig help — so nothing else would notice if it stopped linking.
  # This job is what keeps it honest: reflex_task.h satisfied entirely by
  # Reflex code has to keep building, or the remaining work stops being a
  # Kconfig flip and quietly becomes a rewrite again.
  build-esp32c6-reflex-tasks:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-C6 (Reflex task backend, no FreeRTOS behind reflex_task.h)
        run: |
          . $IDF_PATH/export.sh
          sed -i 's/CONFIG_REFLEX_RADIO_ESPNOW=y/# CONFIG_REFLEX_RADIO_ESPNOW is not set/' sdkconfig.defaults 2>/dev/null || true
          {
            echo "CONFIG_REFLEX_RADIO_802154=y"
            echo "CONFIG_REFLEX_KERNEL_SCHEDULER=y"
            echo "CONFIG_REFLEX_TASK_BACKEND_REFLEX=y"
          } >> sdkconfig.defaults
          idf.py set-target esp32c6
          idf.py build
      - name: Confirm the backend was actually selected
        # A silently-unselected option would make this job green while proving
        # nothing, which is the failure mode of every config-gated build.
        run: |
          grep -q '^CONFIG_REFLEX_TASK_BACKEND_REFLEX=y$' sdkconfig
          nm build/reflex_os.elf | grep -q ' reflex_kqueue_create$'
          ! nm build/reflex_os.elf | grep -q ' xQueueCreate$' || true
          echo "Reflex task backend linked."

  # The configuration the independence claim actually rests on.
  #
  # `independence` above runs on a bare checkout with no build directory, so it
  # reports an upper bound and declines to ratchet — by design, but it means
  # nothing was holding the own-entry numbers. They are the lower ones, and the
  # ones quoted: Tier C fell from 4 to 2 there because REFLEX_OWN_ENTRY fences
  # out ESP-IDF's interrupt table, and a fence is exactly the kind of change
  # that can be undone by accident. This job builds that configuration and
  # ratchets it against its own baseline.
  independence-own-entry:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build the own-entry configuration
        run: |
          . $IDF_PATH/export.sh
          make own-entry-build
      - name: Confirm the flag really reached the compiler
        # The measurement below reads REFLEX_OWN_ENTRY back from
        # compile_commands.json. If the flag silently stopped being passed, the
        # tool would resolve it to "not defined", count the fenced dependencies,
        # and fail honestly — but it would fail for a confusing reason. Say so
        # here instead.
        run: |
          grep -q 'DREFLEX_OWN_ENTRY' build_own_entry/compile_commands.json
          ! nm build_own_entry/esp-idf/esp32c6/CMakeFiles/__idf_esp32c6.dir/reflex_hal_esp32c6.c.obj \
            | grep -q 'U intr_handler_set'
          echo "own-entry build carries the flag and has dropped intr_handler_set."
      - name: Ratchet the own-entry independence floor
        run: make independence-own-entry
      - name: Ratchet the vendor blobs
        # check_independence.py counts ESP-IDF *source* dependencies and cannot
        # see a linked binary at all. Disabling coexistence removed 27 blob
        # symbols and 10,130 bytes without touching a single include, and the
        # independence ratchet reported no movement for it. This is the measure
        # that would have.
        run: |
          . $IDF_PATH/export.sh
          make blob-check

  build-esp32:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32 (mesh peer)
        run: |
          . $IDF_PATH/export.sh
          SDKCONFIG_DEFAULTS="sdkconfig.defaults.esp32" idf.py -B build_esp32 set-target esp32
          idf.py -B build_esp32 build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, tasm-tests, format-diff, warn-check, lock-check, build-esp32c6]
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32c6
          make release
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: reflex-os-release
          path: release/*.zip
